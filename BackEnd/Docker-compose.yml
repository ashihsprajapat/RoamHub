services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: roamhub-backend

    restart: unless-stopped

    ports:
      - "8003:8003"

    env_file:
      - ./.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

  postgres:
    image: postgres:16
    container_name: roamhub-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: roamhub
      POSTGRES_PASSWORD: roamhub_password
      POSTGRES_DB: roamhub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roamhub -d roamhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7

    container_name: roamhub-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

  kafka:

    image: apache/kafka:3.9.0

    container_name: kafka

    hostname: kafka

    restart: unless-stopped

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      KAFKA_NUM_PARTITIONS: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-ui:

    image: provectuslabs/kafka-ui:latest

    container_name: kafka-ui

    restart: unless-stopped

    depends_on:
      - kafka

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  redis-data:
  postgres-data: